[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-habitat"
version = "0.3.5"
description = "Engine-neutral deterministic virtual habitat core for Vera"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vera-habitat-demo = "vera_habitat.demo:main"
vera-habitat-local-room = "vera_habitat.local_room:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vera_habitat" = ["sandbox_assets/*.html", "sandbox_assets/*.js", "sandbox_assets/vendor/*.js", "sandbox_assets/vendor/loaders/*.js", "sandbox_assets/vendor/utils/*.js", "sandbox_assets/vendor/LICENSE"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

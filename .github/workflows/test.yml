name: Habitat foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev]
      - run: pytest
      - run: python -m compileall -q src tests
      - run: python -m vera_habitat.demo

  physica-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        physica_sha:
          # Preserve the original integration contract and verify the later
          # reviewed Physica main without installing a mutable branch.
          - "9cc1ae9c04f728c10d6bdd9f3b277083eb46a834"
          - "8160ed36fb77d4764414f854847447fdc23794d6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # Both integrations pin exact source; never install a moving branch.
      - run: python -m pip install --no-deps "git+https://github.com/thebrazenbeard/physica.git@${{ matrix.physica_sha }}"
      - run: python -c "from physica.spatial import AABB, swept_broad_phase_pairs; assert callable(swept_broad_phase_pairs)"
      - run: python -m pytest -q tests/test_training_ground_physica.py tests/test_physica_backend.py tests/test_physica_fail_closed.py
      - run: python -m compileall -q src tests
